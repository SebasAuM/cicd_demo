name: CI/CD Pipeline - Demo

on:
  pull_request:

jobs:

  # ─────────────────────────────────────────
  # JOB 1: BUILD — Solo hasta fase compile
  # ─────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compilar (mvn compile)
        run: mvn compile

      - name: Guardar clases compiladas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: compiled-target
          path: target/

  # ─────────────────────────────────────────
  # JOB 2: TEST — Fase verify, no recompila
  # ─────────────────────────────────────────
  test:
    name: ✅ Test
    runs-on: ubuntu-latest
    needs: build        # ← prerrequisito: build debe pasar primero

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descargar artefacto del job build
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: target/

      - name: Ejecutar tests (mvn verify -o)
        run: mvn verify

  # ─────────────────────────────────────────
  # JOB 3: DEPLOY — Por ahora solo imprime
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test         # ← prerrequisito: test debe pasar primero

    steps:
      - name: Mensaje de estado
        run: echo "En construcción ..."